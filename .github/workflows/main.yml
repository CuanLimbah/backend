name: Google Cloud Function Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Cloud Functions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_CREDENTIALS }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Deploy Cloud Function (Gen 2)
        run: |
          DEPLOY_ENV_VARS="NODE_ENV=production"
          DEPLOY_ENV_VARS="$DEPLOY_ENV_VARS,GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}"
          DEPLOY_ENV_VARS="$DEPLOY_ENV_VARS,GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}"
          DEPLOY_ENV_VARS="$DEPLOY_ENV_VARS,GOOGLE_REDIRECT_URI=${{ secrets.GOOGLE_REDIRECT_URI }}"
          DEPLOY_ENV_VARS="$DEPLOY_ENV_VARS,FRONTEND_URL=${{ secrets.FRONTEND_URL }}"
          DEPLOY_ENV_VARS="$DEPLOY_ENV_VARS,MONGODB_URI=${{ secrets.MONGODB_URI }}"
          DEPLOY_ENV_VARS="$DEPLOY_ENV_VARS,MONGODB_DB_NAME=${{ secrets.MONGODB_DB_NAME }}"
          DEPLOY_ENV_VARS="$DEPLOY_ENV_VARS,UPSTASH_REDIS_URL=${{ secrets.UPSTASH_REDIS_URL }}"
          DEPLOY_ENV_VARS="$DEPLOY_ENV_VARS,UPSTASH_REDIS_REST_URL=${{ secrets.UPSTASH_REDIS_REST_URL }}"
          DEPLOY_ENV_VARS="$DEPLOY_ENV_VARS,UPSTASH_REDIS_REST_TOKEN=${{ secrets.UPSTASH_REDIS_REST_TOKEN }}"
          DEPLOY_ENV_VARS="$DEPLOY_ENV_VARS,UPSTASH_REDIS_HOST=${{ secrets.UPSTASH_REDIS_HOST }}"
          DEPLOY_ENV_VARS="$DEPLOY_ENV_VARS,UPSTASH_REDIS_PORT=${{ secrets.UPSTASH_REDIS_PORT }}"
          DEPLOY_ENV_VARS="$DEPLOY_ENV_VARS,UPSTASH_REDIS_USERNAME=${{ secrets.UPSTASH_REDIS_USERNAME }}"
          DEPLOY_ENV_VARS="$DEPLOY_ENV_VARS,UPSTASH_REDIS_PASSWORD=${{ secrets.UPSTASH_REDIS_PASSWORD }}"
          DEPLOY_ENV_VARS="$DEPLOY_ENV_VARS,QUEUE_PREFIX=cuanlimbah"
          DEPLOY_ENV_VARS="$DEPLOY_ENV_VARS,JWT_SECRET=${{ secrets.JWT_SECRET }}"
          DEPLOY_ENV_VARS="$DEPLOY_ENV_VARS,JWT_EXPIRES_IN=7d"
          DEPLOY_ENV_VARS="$DEPLOY_ENV_VARS,GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}"
          DEPLOY_ENV_VARS="$DEPLOY_ENV_VARS,CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}"
          DEPLOY_ENV_VARS="$DEPLOY_ENV_VARS,CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}"
          DEPLOY_ENV_VARS="$DEPLOY_ENV_VARS,CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}"
          DEPLOY_ENV_VARS="$DEPLOY_ENV_VARS,AUTO_SEED=false"
          DEPLOY_ENV_VARS="$DEPLOY_ENV_VARS,LLM_PROVIDER=${{ secrets.LLM_PROVIDER }}"
          DEPLOY_ENV_VARS="$DEPLOY_ENV_VARS,EMBEDDING_PROVIDER=${{ secrets.EMBEDDING_PROVIDER }}"
          DEPLOY_ENV_VARS="$DEPLOY_ENV_VARS,VISION_PROVIDER=${{ secrets.VISION_PROVIDER }}"
          DEPLOY_ENV_VARS="$DEPLOY_ENV_VARS,VISION_MODEL=${{ secrets.VISION_MODEL }}"
          DEPLOY_ENV_VARS="$DEPLOY_ENV_VARS,MISTRAL_API_KEY=${{ secrets.MISTRAL_API_KEY }}"
          DEPLOY_ENV_VARS="$DEPLOY_ENV_VARS,MISTRAL_MODEL=mistral-medium-latest"
          DEPLOY_ENV_VARS="$DEPLOY_ENV_VARS,GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}"
          DEPLOY_ENV_VARS="$DEPLOY_ENV_VARS,GEMINI_MODEL=${{ secrets.GEMINI_MODEL }}"
          DEPLOY_ENV_VARS="$DEPLOY_ENV_VARS,OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}"
          DEPLOY_ENV_VARS="$DEPLOY_ENV_VARS,OPENAI_MODEL=gpt-4o-mini"
          DEPLOY_ENV_VARS="$DEPLOY_ENV_VARS,SUPABASE_URL=${{ secrets.SUPABASE_URL }}"
          DEPLOY_ENV_VARS="$DEPLOY_ENV_VARS,SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
          DEPLOY_ENV_VARS="$DEPLOY_ENV_VARS,MIDTRANS_MERCHANT_ID=${{ secrets.MIDTRANS_MERCHANT_ID }}"
          DEPLOY_ENV_VARS="$DEPLOY_ENV_VARS,MIDTRANS_CLIENT_KEY=${{ secrets.MIDTRANS_CLIENT_KEY }}"
          DEPLOY_ENV_VARS="$DEPLOY_ENV_VARS,MIDTRANS_SERVER_KEY=${{ secrets.MIDTRANS_SERVER_KEY }}"
          DEPLOY_ENV_VARS="$DEPLOY_ENV_VARS,MIDTRANS_IS_PRODUCTION=${{ secrets.MIDTRANS_IS_PRODUCTION }}"
          DEPLOY_ENV_VARS="$DEPLOY_ENV_VARS,MIDTRANS_IS_SANITIZED=${{ secrets.MIDTRANS_IS_SANITIZED }}"
          DEPLOY_ENV_VARS="$DEPLOY_ENV_VARS,MIDTRANS_IS_3DS=${{ secrets.MIDTRANS_IS_3DS }}"
          DEPLOY_ENV_VARS="$DEPLOY_ENV_VARS,QUALITY_CASE_VECTOR_PROVIDER=${{ secrets.QUALITY_CASE_VECTOR_PROVIDER }}"
          DEPLOY_ENV_VARS="$DEPLOY_ENV_VARS,QUALITY_CASE_VECTOR_TOP_K=${{ secrets.QUALITY_CASE_VECTOR_TOP_K }}"
          DEPLOY_ENV_VARS="$DEPLOY_ENV_VARS,QUALITY_CASE_VECTOR_MATCH_THRESHOLD=${{ secrets.QUALITY_CASE_VECTOR_MATCH_THRESHOLD }}"
          DEPLOY_ENV_VARS="$DEPLOY_ENV_VARS,QUALITY_CASE_VECTOR_BACKFILL_LIMIT=${{ secrets.QUALITY_CASE_VECTOR_BACKFILL_LIMIT }}"
          DEPLOY_ENV_VARS="$DEPLOY_ENV_VARS,QUALITY_CASE_VECTOR_DIMENSIONS=${{ secrets.QUALITY_CASE_VECTOR_DIMENSIONS }}"
          DEPLOY_ENV_VARS="$DEPLOY_ENV_VARS,QUALITY_CASE_VECTOR_TABLE=${{ secrets.QUALITY_CASE_VECTOR_TABLE }}"
          DEPLOY_ENV_VARS="$DEPLOY_ENV_VARS,QUALITY_CASE_VECTOR_RPC=${{ secrets.QUALITY_CASE_VECTOR_RPC }}"

          gcloud functions deploy cuan-limbah \
            --region=asia-southeast2 \
            --runtime=nodejs22 \
            --gen2 \
            --source=. \
            --entry-point=cuanLimbah \
            --trigger-http \
            --allow-unauthenticated \
            --timeout=540s \
            --memory=1GiB \
            --service-account=renz-cloud@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com \
            --set-env-vars="$DEPLOY_ENV_VARS"

      - name: Check Function Exists
        run: gcloud functions describe cuan-limbah --region=asia-southeast2 --gen2
